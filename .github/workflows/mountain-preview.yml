name: Publish mountain preview
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full tested SHA for the selected preview
        required: true
        type: string
      target:
        description: Preview to publish
        type: choice
        default: mountains
        options:
          - mountains
          - range
      previous_pages_run:
        description: Actions run ID of the currently deployed GitHub Pages artifact
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract the tested standalone range
        if: inputs.target == 'range'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/feature/seeded-plateau-range
          mkdir -p dist
          git show "$SOURCE_SHA:preview/index.html" > dist/index.html
          test -s dist/index.html
      - name: Select the tested game
        if: inputs.target != 'range'
        env:
          SOURCE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        if: inputs.target != 'range'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: inputs.target != 'range'
      - run: npm run build
        if: inputs.target != 'range'
      - name: Verify the active Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_RUN: ${{ inputs.previous_pages_run }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS_RUN" =~ ^[1-9][0-9]*$ ]]
          # Repeated preview builds can share the same root version. Check the run
          # that actually deployed the current site before trusting its artifact.
          deployments=$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" --jq '.[].id')
          active_run_url=''
          for id in $deployments; do
            status=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --jq '.[0] | [.state, .log_url] | @tsv')
            IFS=$'\t' read -r state log_url <<< "$status"
            case "$state" in
              success) active_run_url=$log_url; break ;;
              inactive|failure|error) continue ;;
              *) echo "::error::GitHub Pages deployment $id has unresolved status $state"; exit 1 ;;
            esac
          done
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$PREVIOUS_RUN"
          if [[ "$active_run_url" != "$run_url" && "$active_run_url" != "$run_url/"* ]]; then
            echo "::error::Run $PREVIOUS_RUN is not the active GitHub Pages deployment ($active_run_url)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ inputs.previous_pages_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-artifact
      - name: Update the selected preview in the live site
        env:
          PREVIOUS_RUN: ${{ inputs.previous_pages_run }}
          SOURCE_SHA: ${{ inputs.sha }}
          TARGET: ${{ inputs.target || 'mountains' }}
          SITE_URL: https://depthd.github.io/nimbleintheforest
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/previous-site"
          mkdir -p "$site"
          tar -xf "$RUNNER_TEMP/previous-artifact/artifact.tar" -C "$site"
          verify_live() {
            curl --fail --silent --show-error --location --retry 2 "$SITE_URL/$1" -o "$RUNNER_TEMP/live-file"
            cmp "$RUNNER_TEMP/live-file" "$site/$2"
          }
          verify_live '' index.html
          verify_live version.json version.json
          verify_live test/ test/index.html
          verify_live test/version.json test/version.json
          if [[ -e "$site/mountains" ]]; then
            verify_live mountains/version.json mountains/version.json
          fi
          node -e 'require("fs").writeFileSync("dist/version.json", JSON.stringify({sha:process.env.SOURCE_SHA,run:process.env.GITHUB_RUN_ID,previousPagesRun:process.env.PREVIOUS_RUN}))'
          case "$TARGET" in mountains|range) ;; *) exit 1 ;; esac
          if [[ -e "$site/range" ]]; then
            verify_live range/version.json range/version.json
          fi
          rm -rf -- "$site/$TARGET"
          mv dist "$site/$TARGET"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/previous-site
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
      - name: Link to the published preview
        env:
          SITE_URL: ${{ steps.publish.outputs.page_url }}
          TARGET: ${{ inputs.target || 'mountains' }}
        run: echo "[Открыть тест](${SITE_URL%/}/$TARGET/)" >> "$GITHUB_STEP_SUMMARY"
