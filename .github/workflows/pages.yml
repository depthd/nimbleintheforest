name: Release approved version
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full, tested commit SHA on main approved for publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check out the approved release
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          git checkout --detach "$RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Record build identity
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: node -e 'require("fs").writeFileSync("dist/version.json", JSON.stringify({sha:process.env.RELEASE_SHA,run:process.env.GITHUB_RUN_ID}))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 90
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
