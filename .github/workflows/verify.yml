name: Verify game
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify integration history
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A newly created main has no previous push SHA.
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then BASE=HEAD; fi
          node scripts/repo-check.mjs --base "$BASE"
      - run: python3 tests/repo-guard.py
      - run: npm ci
      - run: npm run build
      - run: npm test
