<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Почему изменился край снега F</title><style>body{margin:0;background:#fcfcfb}svg{display:block;width:100%;height:auto;max-width:1800px;margin:auto}</style><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1980" role="img" aria-labelledby="title desc">
<title id="title">Почему прежний мягкий снег F изменился на кромке дуги</title><desc id="desc">Два сохранённых разреза реальной геометрии в одном масштабе. В эталоне снег касается камня. На выбранном разрезе дуг виден воздушный зазор; длинного прямого торца и лишней толщины края здесь нет. Ниже схемы построения и причины несовпадения.</desc>
<rect width="1800" height="1980" fill="#fcfcfb"/><style>text{font-family:Arial,DejaVu Sans,sans-serif}line,path,polyline{stroke-linejoin:round;stroke-linecap:round}</style>
<text x="55" y="65" font-size="44" font-weight="700" fill="#253b49" text-anchor="start">Почему снег стал выглядеть иначе</text>
<text x="55" y="109" font-size="25" font-weight="400" fill="#526571" text-anchor="start">Вверху — сохранённые разрезы настоящей геометрии. Внизу — объясняющие схемы.</text>
<line x1="55" y1="140" x2="1740" y2="140" stroke="#d1dbe0" stroke-width="1.5"/>
<text x="95" y="190" font-size="31" font-weight="700" fill="#253b49" text-anchor="start">Эталон F: мягкий край</text>
<text x="975" y="190" font-size="31" font-weight="700" fill="#253b49" text-anchor="start">F на кромке «дуги»: тот же срез</text>
<text x="95" y="227" font-size="25" font-weight="400" fill="#2585be" text-anchor="start">Снег лежит на камне</text>
<text x="975" y="227" font-size="25" font-weight="400" fill="#a05e11" text-anchor="start">Под частью снега появился воздух</text>
