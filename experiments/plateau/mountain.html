<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Снежный хребет</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#c1d5e4;color:#f9f5ef;font:14px system-ui}canvas{display:block}
details,#status{position:fixed;background:#242530eb;border:1px solid #656371;border-radius:5px}details{z-index:2;top:12px;left:12px;max-width:min(330px,94vw);padding:10px 13px}summary{cursor:pointer;font-weight:600}nav,form{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}button,input,select{font:inherit;color:inherit;background:#41414c;border:1px solid #73727c;border-radius:3px;padding:4px 7px}button{cursor:pointer}button[aria-pressed=true]{background:#d3d9e4;color:#242535}input[type=number]{width:8em}label{display:block;margin:4px 0}small{display:block;color:#ccd0da;margin:7px 0}#status{bottom:12px;right:12px;padding:7px 11px;font-size:12px}
details{max-height:calc(100dvh - 24px);overflow:auto}#scene-settings{width:100%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:5px 10px;margin-bottom:5px}#scene-settings[hidden],[hidden]{display:none!important}#scene-settings label{margin:0}#scene-settings select{min-width:0}.seed-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.seed-row input{width:7em}#baseline{margin:3px 0}a{color:#e2e8f1}
</style></head><body><details open><summary>Снежный хребет</summary><p id="archive" hidden><span></span> · <a href="?form=range">Исходный хребет</a></p><nav>
<button data-view="range">Общий вид</button><button data-view="trail">На тропе</button><button data-view="vault">Свод целиком</button><button data-view="passage">Под сводом</button><button data-view="roof">На своде</button><button data-view="front">Главная гора</button><button data-view="wall">Боковина</button><button data-view="arch">Каменная арка</button><button data-view="bridge">Мост</button><button data-view="entrance">Пещера</button><button data-view="middle">Средний ярус</button><button data-view="summit">Вершина</button><button data-view="top">Сверху</button><button id="walk" type="button" aria-pressed="false">Пешком</button></nav>
<form><div id="scene-settings">
<label for="count">Гор в сцене</label><select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option></select>
<label for="layers">Ярусов на гору</label><select id="layers"><option value="auto">По сиду</option><option>1</option><option>2</option><option>3</option><option>4</option></select>
<label for="shape">Форма плато</label><select id="shape"><option value="original">Исходная</option><option value="long">Вытянутая</option><option value="broad">Округлая</option><option value="mixed">Разная по горам</option></select>
<label for="height">Высота гор</label><select id="height"><option value="original">Исходная</option><option value="low">Низкие</option><option value="high">Высокие</option><option value="mixed">Разная по горам</option></select>
<label for="relief">Вокруг гор</label><select id="relief"><option value="flat">Равнина</option><option value="hills">Холмы</option><option value="valley">Долина</option></select>
</div><div class="seed-row"><label>Сид <input id="seed" type="number" min="0" max="4294967295" required step="1"></label><button>Собрать</button><button type="button" id="random">Случайный</button></div><button type="button" id="baseline" hidden>Вернуть исходную сцену</button></form>
<label><input type="checkbox" id="rocks" checked> Наращенные скалы</label><label><input type="checkbox" id="snow" checked> Снег на плато</label>
<small>Мышь вращает камеру, колесо приближает. WASD — движение. В полёте Q/E меняют высоту. Пешком — обзор мышью с зажатой кнопкой или стрелками.</small></details><div id="status">Создание горы…</div><script type="module" src="./mountain.ts"></script></body></html>
